<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://use.typekit.net/jkl5xhg.css">
    <script src="https://kit.fontawesome.com/263cf3b7fc.js" crossorigin="anonymous"></script>
    <script src="index.js" type="module" defer></script>
    <title>MakoGo-Seafood</title>
</head>
<body>
    <nav id="main-nav">
                <img id="logo" src="Images/MakoGo Logo.png" alt="MakoGo Logo">
                <button id="home-btn"> 
                    <span class="home-text">Home
                    <i class="fa-sharp-duotone fa-regular fa-house-tsunami" style="--fa-primary-color: #ffffff; --fa-secondary-color: rgb(43, 120, 180);"></i>
                    </span>
                </button>
                
                <button id="menu-btn">
                    <span class="menu-text">Menu
                    <i class="fa-regular fa-fish-bones" style="color: #ffffff;"></i>
                    </span>
                </button>
                
                <button id="about-btn">
                    <span class="about-text">About
                    <i class="fa-sharp fa-solid fa-circle-info" style="color: #ffffff;"></i>
                    </span>
                </button>
                
                <button id="contact-btn">
                    <span class="contact-text">Contact
                    <i class="fa-regular fa-envelope" style="color: #ffffff;"></i>
                    </span>
                </button>
            </nav>
    <header>
        <div id="slogans">
            <h1>Fast.</h1>
            <h1>Fresh.</h1>
            <h1>Flavorful.</h1>
            <h1>The Mako Way.</h1>
            <button id="order-now">ORDER NOW</button>
        </div>
        <div class="food-image-container">
            <div class="food-image-slides">
                <div class="slide active">
                    <img src="Images/BreakfastBiscuit.png" alt="BreakfastBiscuit">
                </div>
                <div class="slide">
                    <img src="Images/Firefly_Gemini Flash_Picture of seafood dinner dish if it was fast food 123944.png" alt="Shrimp">
                </div>
                <div class="slide">
                    <img src="Images/Fish&ShrimpCombo.png" alt="Fish and Shrimp Combo">
                </div>
                <div class="slide">
                    <img src="Images/Firefly_Gemini Flash_ breakfast skillet for fast food 123944.png" alt="Breakfast skillet">
                </div>
               <button class="carousel-btn prev" onclick="moveSlide(-1)">&#10094</button>
            <button class="carousel-btn next" onclick="moveSlide(1)">&#10095</button> 
            </div>    
            
        </div>
    </header>
    
    <div class="background-container">
                    <svg class="horizontal-wave" viewbox="0 0 1400 300" preserveAspectRatio="none">
                        
                        <path d="M -360,180
                                 Q -180,60 0,180
                                 S 180,60 360,180
                                 S 540,60 720,180
                                 S 900,60 1080,180
                                 S 1260,60 1440,180
                                 L 1440,300
                                 L 0,300
                                 Z" 
                            fill="rgba(14, 68, 178, 0.99)"  />
                    </svg>
            </div>
    <div id="content">
    <div id="block"></div>





    </div>
    <footer></footer>
    
    <script>
        let currentSlideIndex = 0;
        const slides = document.querySelectorAll('.slide');

        function moveSlide(direction){
            slides[currentSlideIndex].classList.remove('active');
            currentSlideIndex += direction;

            if (currentSlideIndex >= slides.length){
                currentSlideIndex = 0;
            } else if (currentSlideIndex < 0){
                currentSlideIndex = slides.length - 1;
            }
            slides[currentSlideIndex].classList.add('active');

        }
        setInterval(() => moveSlide(1), 5000);
    </script>
</body>
</html>
